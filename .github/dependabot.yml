version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-runtime:
        dependency-type: production
        patterns: ["*"]
      python-development:
        dependency-type: development
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/web
    # API generation and ESLint require the TypeScript 5 JavaScript API.
    # Application typechecking uses the separate @typescript/native alias.
    ignore:
      - dependency-name: typescript
        versions: [">=6"]
    schedule:
      interval: weekly
    groups:
      frontend-runtime:
        dependency-type: production
        patterns: ["*"]
      frontend-development:
        dependency-type: development
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker/control-plane
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker/agent
    schedule:
      interval: weekly
