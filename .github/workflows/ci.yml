name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lab_platform_test
          POSTGRES_PASSWORD: lab_test
          POSTGRES_USER: lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_test -d lab_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -m "not hardware"
        env:
          LAB_PLATFORM_TEST_POSTGRESQL_URL: >-
            postgresql://lab_test:lab_test@127.0.0.1:5432/lab_platform_test
      - run: uv run python scripts/export_openapi.py --service agent --check docs/openapi.json
      - run: >-
          uv run python scripts/export_openapi.py --service control-plane --check
          docs/control-plane-openapi.json
      - run: uv build
