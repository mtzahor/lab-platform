name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deployment-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production, demo, and acceptance Compose manifests
        shell: bash
        env:
          COMPOSE_PROJECT_NAME: lab-platform-acceptance-manifest
          LAB_ACCEPTANCE_VOLUME_PREFIX: lab-platform-acceptance-manifest
          LAB_CONTROL_PLANE_IMAGE: lab-platform-control-plane:manifest
          LAB_AGENT_IMAGE: lab-platform-agent:manifest
        run: |
          deployment_dir="${RUNNER_TEMP}/lab-platform-production"
          cp -R deploy/production "${deployment_dir}"
          cp "${deployment_dir}/.env.example" "${deployment_dir}/.env"
          mkdir -p "${deployment_dir}/secrets"
          touch "${deployment_dir}/secrets/postgres-password"
          touch "${deployment_dir}/secrets/database-url"
          touch "${deployment_dir}/secrets/control-plane-secret-key"
          docker compose --env-file "${deployment_dir}/.env" \
            -f "${deployment_dir}/compose.yaml" config --quiet
          docker compose -f deploy/demo/compose.yaml config --quiet
          docker compose -f deploy/acceptance/compose.yaml config --quiet

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lab_platform_test
          POSTGRES_PASSWORD: lab_test
          POSTGRES_USER: lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_test -d lab_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --frozen --extra dev
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/web
      - name: Python format
        run: uv run ruff format --check .
      - name: Python lint
        run: uv run ruff check .
      - name: Python typecheck
        run: uv run mypy
      - name: Frontend format
        run: npm run format:check
        working-directory: apps/web
      - name: Frontend lint
        run: npm run lint
        working-directory: apps/web
      - name: Frontend typecheck
        run: npm run typecheck
        working-directory: apps/web
      - name: Frontend unit and component tests
        run: npm run test
        working-directory: apps/web
      - name: Check generated frontend API client
        run: npm run api:check
        working-directory: apps/web
      - name: Frontend dependency audit
        run: npm run audit:dependencies
        working-directory: apps/web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Frontend fixture browser tests
        run: npm run e2e
        working-directory: apps/web
      - name: Real control-plane and SimLab browser tests
        run: npm run e2e:integration
        working-directory: apps/web
      - name: Python, SimLab, and real PostgreSQL migration tests
        run: uv run pytest -m "not hardware"
        env:
          LAB_PLATFORM_TEST_POSTGRESQL_URL: >-
            postgresql://lab_test:lab_test@127.0.0.1:5432/lab_platform_test
      - name: Check Agent OpenAPI contract
        run: uv run python scripts/export_openapi.py --service agent --check docs/openapi.json
      - name: Check control-plane OpenAPI contract
        run: >-
          uv run python scripts/export_openapi.py --service control-plane --check
          docs/control-plane-openapi.json
      - name: Build production dashboard
        run: npm run build
        working-directory: apps/web
      - name: Check committed dashboard bundle
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- apps/control_plane/src/lab_platform/control_plane/web_dist)" ]]; then
            git status --short -- apps/control_plane/src/lab_platform/control_plane/web_dist
            echo "The packaged dashboard is stale. Run npm run build in apps/web."
            exit 1
          fi
      - name: Build Python source and wheel distributions
        run: uv build
      - name: Inspect dashboard in wheel
        run: uv run python scripts/verify_web_wheel.py dist/*.whl

  published-artifact-acceptance:
    needs: [quality, deployment-manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build tagged control-plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/control-plane/Dockerfile
          load: true
          tags: lab-platform-control-plane:deployment-acceptance
          cache-from: type=gha,scope=deployment-acceptance-control-plane
          cache-to: type=gha,mode=max,scope=deployment-acceptance-control-plane
      - name: Build tagged Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agent/Dockerfile
          load: true
          tags: lab-platform-agent:deployment-acceptance
          cache-from: type=gha,scope=deployment-acceptance-agent
          cache-to: type=gha,mode=max,scope=deployment-acceptance-agent
      - name: Exercise deployment, migration, backup, and isolated restore
        run: >-
          python scripts/deployment_acceptance.py
          --control-plane-image lab-platform-control-plane:deployment-acceptance
          --agent-image lab-platform-agent:deployment-acceptance
          --work-directory "${RUNNER_TEMP}/deployment-acceptance"
      - name: Upload deployment acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-acceptance-evidence
          path: ${{ runner.temp }}/deployment-acceptance/
          if-no-files-found: warn
