# Production-oriented control-plane example. Supply the real DSN and TLS files through your
# deployment secret/configuration system; never commit database passwords or private keys.
config_version: 1

control_plane:
  host: 0.0.0.0
  port: 8443
  public_url: https://lab-control.internal:8443
  log_level: INFO
  max_request_body_size_mb: 1
  tls_certificate_path: /etc/lab-platform/control-plane.crt
  tls_private_key_path: /etc/lab-platform/control-plane.key

database:
  # PostgreSQL is the production control-plane store. This password-free example expects libpq
  # credentials from a protected PGPASSFILE or equivalent deployment-secret injection.
  # Prefer sslmode=verify-full with sslrootcert in environments that provide a private CA.
  url: postgresql://lab@database.internal:5432/lab_platform?sslmode=require&connect_timeout=10

agent_gateway:
  heartbeat_interval_seconds: 15
  heartbeat_timeout_seconds: 45
  offline_timeout_seconds: 90
  handshake_timeout_seconds: 10
  maximum_message_size_mb: 2
  outgoing_queue_size: 256
  sequence_window_size: 4096
  monitor_interval_seconds: 1.0

artifacts:
  directory: /var/lib/lab-platform/artifacts
  maximum_upload_size_mb: 500
  transfer_token_ttl_seconds: 300
  finalization_timeout_seconds: 300

distributed:
  maximum_clock_skew_seconds: 30
  offline_reservation_grace_seconds: 300
  operation_reconciliation_timeout_seconds: 600
  queue_commands_for_offline_agents: false

identity:
  enabled: true
  default_organisation_slug: default
  default_organisation_name: Default Organisation
  local_auth:
    enabled: true
    minimum_password_length: 12
  oidc:
    enabled: false
    # Set issuer_url, client_id, and client_secret_env before enabling OIDC.
    scopes:
      - openid
      - profile
      - email
  sessions:
    access_token_minutes: 15
    session_hours: 12
    maximum_session_days: 7

authorisation:
  default_bench_visibility: organisation
  hide_unauthorised_resources: true
  legacy_token_compatibility_enabled: true

audit:
  enabled: true
  retention_days: 90

security:
  login_rate_limit:
    attempts: 10
    window_minutes: 15

web:
  # Integrated serving is the canonical self-hosted layout; use HTTPS in production.
  enabled: true
  public_url: https://lab-control.internal:8443
  api_base_url: /api/v1
  live_updates:
    sse_enabled: true
    polling_fallback_seconds: 5
  uploads:
    maximum_firmware_size_mb: 100
  features:
    identity_admin: true
    audit_viewer: true
    ci_sessions: true
  branding:
    product_name: Lab Platform

development:
  enabled: false
  allow_insecure_agent_transport: false
  allow_tls_termination_proxy: false
