control_plane:
  host: 127.0.0.1
  port: 8443
  public_url: http://127.0.0.1:8443
  log_level: INFO
  max_request_body_size_mb: 1
  # Configure both paths and use an https:// public URL outside the loopback-only demo.
  # tls_certificate_path: /etc/lab-platform/control-plane.crt
  # tls_private_key_path: /etc/lab-platform/control-plane.key

# SQLite is retained for this loopback developer demo. Use PostgreSQL for a production control
# plane; see config/control-plane.postgresql.yaml. Agent-local journals and buffers remain SQLite.
database:
  url: sqlite:///./.lab-control-plane/control-plane.db

agent_gateway:
  heartbeat_interval_seconds: 15
  heartbeat_timeout_seconds: 45
  offline_timeout_seconds: 90
  handshake_timeout_seconds: 10
  maximum_message_size_mb: 2
  outgoing_queue_size: 256
  sequence_window_size: 4096
  monitor_interval_seconds: 1.0

artifacts:
  directory: ./.lab-control-plane/artifacts
  maximum_upload_size_mb: 500
  transfer_token_ttl_seconds: 300
  finalization_timeout_seconds: 300

distributed:
  maximum_clock_skew_seconds: 30
  offline_reservation_grace_seconds: 300
  operation_reconciliation_timeout_seconds: 600
  queue_commands_for_offline_agents: false

identity:
  enabled: true
  default_organisation_slug: default
  default_organisation_name: Default Organisation
  local_auth:
    enabled: true
    minimum_password_length: 12
  oidc:
    enabled: false
    scopes:
      - openid
      - profile
      - email
  sessions:
    access_token_minutes: 15
    session_hours: 12
    maximum_session_days: 7

authorisation:
  default_bench_visibility: organisation
  hide_unauthorised_resources: true
  # Keep Phase 4 bearer tokens usable during the configured migration period.
  legacy_token_compatibility_enabled: true

audit:
  enabled: true
  retention_days: 90

security:
  login_rate_limit:
    attempts: 10
    window_minutes: 15

development:
  enabled: true
  auto_login_user: local-admin
  allow_insecure_agent_transport: true
  # Set only when a reverse proxy on this same host terminates public HTTPS/WSS
  # and the control-plane process itself remains bound to a loopback interface.
  allow_tls_termination_proxy: false
