[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-platform"
version = "0.5.0a0"
description = "Local-first remote hardware bench management platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lab Platform Contributors" }]
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic>=2.8,<3",
    "python-multipart>=0.0.20,<1",
    "pyserial>=3.5,<4",
    "PyYAML>=6.0.1,<7",
    "uvicorn>=0.35,<1",
    "esptool>=4.8,<5",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
lab-agent = "lab_platform.agent.cli:main"
labctl = "lab_platform.cli.main:main"

[tool.setuptools]
packages = [
    "lab_platform.agent",
    "lab_platform.agent.api",
    "lab_platform.cli",
    "lab_platform.config",
    "lab_platform.core",
    "lab_platform.logging",
    "lab_platform.models",
    "lab_platform.persistence",
    "lab_platform.plugins",
    "lab_platform.real_backend",
    "lab_platform.real_backend.targets",
    "lab_platform.real_backend.targets.esp32",
    "lab_platform.simlab",
    "lab_platform.simlab_adapter",
]

[tool.setuptools.package-dir]
"lab_platform.agent" = "apps/agent/src/lab_platform/agent"
"lab_platform.agent.api" = "apps/agent/src/lab_platform/agent/api"
"lab_platform.cli" = "apps/cli/src/lab_platform/cli"
"lab_platform.config" = "packages/config/src/lab_platform/config"
"lab_platform.core" = "packages/core/src/lab_platform/core"
"lab_platform.logging" = "packages/logging/src/lab_platform/logging"
"lab_platform.models" = "packages/models/src/lab_platform/models"
"lab_platform.persistence" = "packages/persistence/src/lab_platform/persistence"
"lab_platform.plugins" = "packages/plugins/src/lab_platform/plugins"
"lab_platform.real_backend" = "packages/real_backend/src/lab_platform/real_backend"
"lab_platform.real_backend.targets" = "packages/real_backend/src/lab_platform/real_backend/targets"
"lab_platform.real_backend.targets.esp32" = "packages/real_backend/src/lab_platform/real_backend/targets/esp32"
"lab_platform.simlab" = "packages/simlab/src/lab_platform/simlab"
"lab_platform.simlab_adapter" = "packages/simlab_adapter/src/lab_platform/simlab_adapter"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["apps", "packages", "tests"]
strict = true
warn_unreachable = true
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "apps/agent/src",
    "apps/cli/src",
    "packages/config/src",
    "packages/core/src",
    "packages/logging/src",
    "packages/models/src",
    "packages/persistence/src",
    "packages/plugins/src",
    "packages/real_backend/src",
    "packages/simlab/src",
    "packages/simlab_adapter/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lab_platform --cov-report=term-missing --cov-fail-under=90"
markers = [
    "backend_contract: shared behavioral contract for LabBackend implementations",
    "hardware: requires an explicitly enabled physical hardware bench",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
]
